version: '3.9'

services:
  seq:
    image: datalust/seq:latest
    container_name: syswatch-seq
    ports:
      - "8080:80"        # Web UI at http://localhost:8080
      - "5341:5341"      # Ingestion endpoint
    environment:
      - ACCEPT_EULA=Y
    volumes:
      - seq-data:/data
    networks:
      - metrics-net
    restart: unless-stopped

  metrics-hub:
    build:
      context: .
      dockerfile: MetricsHub/Dockerfile
    container_name: metrics-hub
    ports:
      - "5000:5000"   # HTTP + SignalR
      - "9080:9080"   # Akka.Remote TCP
    environment:
      - Akka__Port=9080
      - Akka__Hostname=0.0.0.0
      - Akka__PublicHostname=metrics-hub
      - Kestrel__Endpoints__Http__Url=http://0.0.0.0:5000
      - Seq__Endpoint=http://seq:8080
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://seq:5341/ingest/otlp
    depends_on:
      - seq
    networks:
      - metrics-net
    restart: unless-stopped

  metrics-ui:
    build:
      context: ./angular-ui
      dockerfile: Dockerfile
    container_name: metrics-ui
    ports:
      - "80:80"
    depends_on:
      - metrics-hub
    networks:
      - metrics-net
    restart: unless-stopped

  collector-node1:
    build:
      context: .
      dockerfile: MetricsCollector/Dockerfile
    container_name: collector-node1
    ports:
      - "5001:5001"   # REST API
      - "8081:8081"   # Akka.Remote TCP
    environment:
      - Akka__NodeId=docker-node-1
      - Akka__Port=8081
      - Akka__PublicHostname=collector-node1
      - Akka__HubAddress=akka.tcp://MetricsHub@metrics-hub:9080/user/metrics-hub
      - Kestrel__Endpoints__Http__Url=http://0.0.0.0:5001
      - Seq__Endpoint=http://seq:8080
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://seq:5341/ingest/otlp
    depends_on:
      - metrics-hub
      - seq
    networks:
      - metrics-net
    restart: unless-stopped

  collector-node2:
    build:
      context: .
      dockerfile: MetricsCollector/Dockerfile
    container_name: collector-node2
    ports:
      - "5002:5001"
      - "8082:8081"
    environment:
      - Akka__NodeId=docker-node-2
      - Akka__Port=8081
      - Akka__PublicHostname=collector-node2
      - Akka__HubAddress=akka.tcp://MetricsHub@metrics-hub:9080/user/metrics-hub
      - Kestrel__Endpoints__Http__Url=http://0.0.0.0:5001
      - Seq__Endpoint=http://seq:8080
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://seq:5341/ingest/otlp
    depends_on:
      - metrics-hub
      - seq
    networks:
      - metrics-net
    restart: unless-stopped

networks:
  metrics-net:
    driver: bridge

volumes:
  seq-data:
